[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-shadow"
version = "0.1.0"
description = "Electron point-projection imaging of charged water droplets"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6"]

[project.optional-dependencies]
notebook = ["nbformat>=5", "nbclient>=0.8", "ipykernel>=6"]
test = ["pytest>=8"]

[project.scripts]
droplet-shadow = "droplet_shadow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
